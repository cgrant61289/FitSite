services:
  - type: web
    name: fitsite
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/var/data/fitsite.db
    disks:
      - name: fitsite-data
        mountPath: /var/data
        sizeGB: 1